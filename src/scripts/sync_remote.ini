[remote]
# SSH host — can be a hostname, IP, or alias from ~/.ssh/config (e.g. "zo")
host = zo
# Absolute path on the remote server to sync from
source_dir = /home/user/data

[local]
# Local directory to sync into (created if it does not exist)
target_dir = /workspace/data

[options]
# Skip files that already exist locally (default: true)
# Set to false to overwrite if remote file is newer
skip_existing = true
# Show per-file transfer progress
verbose = true
# Dry run — print what would happen without transferring anything
dry_run = false
