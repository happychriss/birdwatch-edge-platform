<!DOCTYPE html>
<html>
<head>
    <title>Browse Results</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        img {
            max-width: 90%;
            max-height: 90%;
        }
        .info-container {
            margin: 10px 0;
            padding: 10px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 800px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        .info-label {
            font-weight: bold;
            margin-right: 10px;
        }
        .buttons {
            margin-top: 20px;
        }
        .buttons button {
            padding: 10px 20px;
            margin: 0 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .buttons button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Image Details</h1>
    <div class="info-container">


        <div class="info-row">
            <span class="info-label">Paht:</span>
            <span>{{ image_path }}</span>
        </div>


        <div class="info-row">
            <span class="info-label">Timestamp:</span>
            <span>{{ timestamp }}</span>
        </div>
        {% if ldr_power is not none %}
        <div class="info-row">
            <span class="info-label">LDR Power:</span>
            <span>{{ ldr_power }}</span>
        </div>
        {% endif %}
        {% if time_diff is not none %}
        <div class="info-row">
            <span class="info-label">Time since previous picture:</span>
            <span>{{ time_diff }}</span>
        </div>
        {% endif %}
    </div>
    <img src="{{ url_for('static', filename=image_path) }}" alt="Latest Image">
    <div class="buttons">
        <button onclick="window.location.href='/browse_results?index={{ prev_index }}'">Previous</button>
        <button onclick="window.location.href='/browse_results?index={{ next_index }}'">Next</button>
        <button onclick="window.location.href='/'">Close</button>
    </div>
</body>
</html>
